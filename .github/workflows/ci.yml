name: Testes Flaskr

on:
  push:
    branches: [main, etapa-9-tdd-ci, etapa-9-demonstracao-red, etapa-10-entrega-final]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      revisao_sonar:
        description: Revisão do Flaskr para testar e analisar
        type: choice
        default: branch-atual
        options:
          - branch-atual
          - linha-de-base
          - refatoracao

permissions:
  contents: read

jobs:
  testar:
    name: pytest, Newman e Selenium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      revisao: ${{ steps.revisao.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.revisao_sonar == 'linha-de-base' && 'eae6f811c9ff3cdb8c2424a6be640a48a0c8fe60' || inputs.revisao_sonar == 'refatoracao' && 'd7c225cf16e504fdfb92c9235762bf6ba3f0dc19' || '' }}
      - name: Registrar a revisão que será testada
        id: revisao
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Instalar dependências
        run: python -m pip install -r requirements-test.txt
      - name: Registrar ferramentas
        run: |
          python --version
          node --version
          google-chrome --version
      - name: Executar suítes
        run: bash tools/executar_ci.sh
      - name: Publicar JUnit, cobertura e capturas de falha
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-flaskr
          path: artefatos-ci/
          if-no-files-found: warn
          retention-days: 30
  sonar:
    name: SonarQube Cloud
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref_name == github.event.repository.default_branch ||
       inputs.revisao_sonar == 'linha-de-base' ||
       inputs.revisao_sonar == 'refatoracao') &&
      vars.SONAR_ORGANIZATION != '' &&
      vars.SONAR_PROJECT_KEY != ''
    needs: testar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.testar.outputs.revisao }}
      - uses: actions/download-artifact@v8
        with:
          name: testes-flaskr
          path: artefatos-ci
      - name: Ajustar os caminhos do XML ao diretório analisado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          app = Path("flaskr-app/flaskr").resolve()
          cobertura = ET.parse("artefatos-ci/coverage.xml")
          for origem in cobertura.findall("sources/source"):
              origem.text = Path(origem.text).resolve().relative_to(app).as_posix()
          cobertura.write("artefatos-ci/coverage-sonar.xml", encoding="utf-8", xml_declaration=True)
          PY
      - name: Analisar código e importar cobertura
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: flaskr-app/flaskr
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.branch.name=${{ github.event.repository.default_branch }}
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=${{ github.workspace }}/artefatos-ci/coverage-sonar.xml
            -Dsonar.projectVersion=${{ needs.testar.outputs.revisao }}
            -Dsonar.scm.revision=${{ needs.testar.outputs.revisao }}
