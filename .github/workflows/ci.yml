name: Testes Flaskr

on:
  push:
    branches: [main, etapa-9-tdd-ci, etapa-9-demonstracao-red, etapa-10-entrega-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    name: pytest, Newman e Selenium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Instalar dependências
        run: python -m pip install -r requirements-test.txt
      - name: Registrar ferramentas
        run: |
          python --version
          node --version
          google-chrome --version
      - name: Executar suítes
        run: bash tools/executar_ci.sh
      - name: Publicar JUnit, cobertura e capturas de falha
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testes-flaskr
          path: artefatos-ci/
          if-no-files-found: warn
          retention-days: 30
  sonar:
    name: SonarQube Cloud
    if: github.event_name == 'workflow_dispatch' && vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != ''
    needs: testar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: testes-flaskr
          path: artefatos-ci
      - name: Analisar código e importar cobertura
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.projectVersion=${{ github.sha }}
